services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${API_HTTP_PORT:-3001}:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_PATH: /data/films.db
      CORS_ORIGIN: ${CORS_ORIGIN:-https://films.qzz.io,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - films-db:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - films-net
    restart: unless-stopped

  films:
    depends_on:
      - api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_KINOPOISK_API_KEY: ${VITE_KINOPOISK_API_KEY:-}
        VITE_KINOPOISK_API_BASE_URL: ${VITE_KINOPOISK_API_BASE_URL:-https://kinopoiskapiunofficial.tech/api}
        VITE_ALLOHA_TOKEN: ${VITE_ALLOHA_TOKEN:-}
        VITE_PLAYER_EMBED_DOMAIN: ${VITE_PLAYER_EMBED_DOMAIN:-nayteruz.github.io}
        VITE_ENABLE_ALOHA: ${VITE_ENABLE_ALOHA:-true}
        VITE_HDVB_TOKEN: ${VITE_HDVB_TOKEN:-}
        VITE_PLAYER_TEMPLATES: ${VITE_PLAYER_TEMPLATES:-}
    ports:
      - "${FILMS_HTTP_PORT:-8080}:80"
    networks:
      - films-net
    restart: unless-stopped

volumes:
  films-db:

networks:
  films-net:
    driver: bridge
